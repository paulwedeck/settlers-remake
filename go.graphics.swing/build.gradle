apply plugin: 'java'

import jsettlers.shaders.compile.ShaderCompilationTask

String[] variants = new String[] {
		"natives-linux",
		"natives-linux-arm32",
		"natives-linux-arm64",
		"natives-macos",
		"natives-macos-arm64",
		"natives-windows",
		"natives-windows-x86",
		"natives-windows-arm64",
};

String[] modules = new String[] {
		"lwjgl",
		"lwjgl-opengl",
		"lwjgl-openal",
		"lwjgl-glfw",
		"lwjgl-vma",
}

dependencies {
	implementation project(':go.graphics')

	def lwjglVersion = rootProject.ext.lwjglVersion

	for(String module : modules) {
		implementation "org.lwjgl:" + module + ":" + lwjglVersion

		for(String variant : variants) {
			runtimeOnly "org.lwjgl:" + module + ":" + lwjglVersion + ":" + variant
		}
	}

	implementation "org.lwjgl:lwjgl-vulkan:" + lwjglVersion
	// lwjgl-vulkan only ships native MoltenVK for macOS (x64 and arm64). On Linux/Windows it loads
	// libvulkan from the system at runtime, so no native classifier is published for those platforms.
	runtimeOnly "org.lwjgl:lwjgl-vulkan:" + lwjglVersion + ":natives-macos"
	runtimeOnly "org.lwjgl:lwjgl-vulkan:" + lwjglVersion + ":natives-macos-arm64"
	implementation "org.lwjgl:lwjgl-egl:" + lwjglVersion
	implementation "org.lwjgl:lwjgl-jawt:" + lwjglVersion

	implementation "org.joml:joml:1.9.17"
	// lwjgl3-awt 0.2.x uses Maven profile activation to pick its LWJGL natives via ${lwjgl.natives};
	// Gradle does not evaluate Maven profiles, so we exclude its transitive natives and rely on the
	// LWJGL natives declared explicitly above.
	implementation("org.lwjglx:lwjgl3-awt:0.2.3") {
		exclude group: 'org.lwjgl'
	}


	// macos support
	implementation "org.jogamp.gluegen:gluegen-rt:2.6.0"
	implementation "org.jogamp.jogl:jogl-all:2.6.0"
	runtimeOnly "org.jogamp.gluegen:gluegen-rt:2.6.0:natives-macosx-universal"
	runtimeOnly "org.jogamp.jogl:jogl-all:2.6.0:natives-macosx-universal"
}

def shaderDefinitionDir = 'src/main/glsl/'
def shaderJavaOutputDir = 'src/generated/java'
def shaderResOutputDir = 'src/generated/resources'

sourceSets {
	main.java.srcDirs += [shaderJavaOutputDir]
	main.resources.srcDirs += [shaderResOutputDir]
}

clean {
	delete file(shaderJavaOutputDir)
	delete file(shaderResOutputDir)
}

task compileShaders(type: ShaderCompilationTask) {
	inputDirectory = file(shaderDefinitionDir).toPath()
	generatedSourcesDirectory = file(shaderJavaOutputDir).toPath()
	generatedResourcesDirectory = file(shaderResOutputDir).toPath()
}

compileJava {
	dependsOn compileShaders
}

copyMainResources {
	dependsOn compileShaders
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}
